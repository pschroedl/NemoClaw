apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-auth-proxy
  namespace: workers
  labels:
    app.kubernetes.io/name: llama-auth-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llama-auth-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llama-auth-proxy
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: gyber-disco
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          image: ghcr.io/pschroedl/nemoclaw-inference-auth-proxy:REPLACE_WITH_DIGEST
          imagePullPolicy: IfNotPresent
          env:
            - name: UPSTREAM_URL
              value: http://llama-5090.workers.svc.cluster.local:8080
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: inference-key
              mountPath: /run/secrets/inference
              readOnly: true
      volumes:
        - name: inference-key
          secret:
            secretName: llama-api-key
            defaultMode: 0440
