apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llama-auth-proxy
  namespace: workers
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: llama-auth-proxy
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              openshell.ai/inference-client: "true"
          podSelector:
            matchExpressions:
              - key: agents.x-k8s.io/sandbox-name-hash
                operator: Exists
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: llama-5090
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
